# main: build all 14 images once, push them to ECR as :<git sha>, sign them (cosign, AWS KMS key; no public
# transparency log), attach SBOM and provenance, then open an auto-merge PR in llmops-deploy that renders
# platform/main and bumps envs/aws-test (Argo CD deploys it).
# v* tags: re-tag the images, publish a GitHub Release with the contracts bundle, open PRs adding
# platform/<tag>/ to llmops-deploy and vendoring the contracts into llmops-portal-web.
# Needs: variables AWS_REGION, ECR_REGISTRY, AWS_CI_PUSH_ROLE_ARN, COSIGN_KMS_KEY; secrets CI_APP_ID, CI_APP_PRIVATE_KEY.
# Until AWS_CI_PUSH_ROLE_ARN is set, every job here is skipped, so a fresh repository shows no failures.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR: ${{ vars.ECR_REGISTRY }}
  DEPLOY_REPO: llmops-deploy
  WEB_REPO: llmops-portal-web

jobs:
  images:
    if: vars.AWS_CI_PUSH_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        component: [db-migrate, llm-gateway, crawler-agent, publisher, view-builder, content-api, assistant-api,
                    request-api, key-provisioner, notifier, dataset-manager, test-orchestrator, test-runner,
                    results-publisher]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.0.5
      - name: Image tags
        id: tags
        run: |
          tags="$ECR/llmops/${{ matrix.component }}:${GITHUB_SHA}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tags="$tags,$ECR/llmops/${{ matrix.component }}:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: components/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Sign (KMS key; signature stored next to the image in ECR)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key "${{ vars.COSIGN_KMS_KEY }}" --tlog-upload=false \
            --use-signing-config=false --new-bundle-format=false "$ECR/llmops/${{ matrix.component }}@$DIGEST"

  deploy-pr:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DEPLOY_REPO }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DEPLOY_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: deploy
      - name: Render platform/main and bump envs/aws-test
        run: |
          rm -rf deploy/platform/main
          python3 tools/render_deploy.py --k8s-out deploy/platform/main --argocd
          printf '{"repo": "%s", "commit": "%s", "ref": "%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            > deploy/platform/main/VERSION.json
          python3 deploy/scripts/set_images.py deploy/envs/aws-test --registry "$ECR" --tag "$GITHUB_SHA" --except portal-web
      - name: Pull request (auto-merge after validate)
        working-directory: deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          short=${GITHUB_SHA::12}
          branch="platform/$short"
          git config user.name "llmops-ci[bot]"
          git config user.email "llmops-ci@users.noreply.github.com"
          git checkout -b "$branch"
          git add platform/main envs/aws-test
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "llmops-platform $short: platform/main and aws-test images"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --label automerge \
            --title "llmops-platform $short → aws-test" \
            --body "Rendered from ${GITHUB_REPOSITORY}@${GITHUB_SHA}; images ${ECR}/llmops/*:${GITHUB_SHA} (signed)."
          gh pr merge "$branch" --auto --squash

  tag-release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tools
        run: >-
          pip install pyyaml jsonschema -r libs/llmops-common/requirements.in
          -r libs/llmops-common/requirements-fastapi.in
      - name: Contracts bundle
        run: |
          python3 tools/export_openapi.py --check
          tar -czf "contracts-$GITHUB_REF_NAME.tar.gz" contracts
          sha256sum "contracts-$GITHUB_REF_NAME.tar.gz" > "contracts-$GITHUB_REF_NAME.tar.gz.sha256"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "contracts-$GITHUB_REF_NAME.tar.gz" "contracts-$GITHUB_REF_NAME.tar.gz.sha256" \
            --generate-notes --verify-tag
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DEPLOY_REPO }},${{ env.WEB_REPO }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DEPLOY_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: deploy
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.WEB_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: web
      - name: PR to llmops-deploy — platform/<tag> (immutable)
        working-directory: deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [ ! -e "platform/$GITHUB_REF_NAME" ] || { echo "platform/$GITHUB_REF_NAME already exists"; exit 1; }
          python3 ../tools/render_deploy.py --k8s-out "platform/$GITHUB_REF_NAME" --argocd
          printf '{"repo": "%s", "commit": "%s", "ref": "%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            > "platform/$GITHUB_REF_NAME/VERSION.json"
          git config user.name "llmops-ci[bot]"; git config user.email "llmops-ci@users.noreply.github.com"
          git checkout -b "platform/$GITHUB_REF_NAME"
          git add "platform/$GITHUB_REF_NAME"
          git commit -m "llmops-platform $GITHUB_REF_NAME: platform/$GITHUB_REF_NAME"
          git push origin "platform/$GITHUB_REF_NAME"
          gh pr create --base main --head "platform/$GITHUB_REF_NAME" --title "llmops-platform $GITHUB_REF_NAME" \
            --body "Rendered from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Promote with the promote-onprem workflow after merging."
      - name: PR to llmops-portal-web — vendored contracts
        working-directory: web
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p contracts/fixtures contracts/schemas contracts/openapi
          cp ../contracts/fixtures/portal-view.sample.json contracts/fixtures/
          cp ../contracts/schemas/request.schema.json contracts/schemas/
          cp ../contracts/openapi/*.json contracts/openapi/
          python3 scripts/contracts_version.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
          git add contracts
          if git diff --cached --quiet; then echo "contracts unchanged"; exit 0; fi
          git config user.name "llmops-ci[bot]"; git config user.email "llmops-ci@users.noreply.github.com"
          git checkout -b "contracts/$GITHUB_REF_NAME"
          git commit -m "contracts from llmops-platform $GITHUB_REF_NAME"
          git push origin "contracts/$GITHUB_REF_NAME"
          gh pr create --base main --head "contracts/$GITHUB_REF_NAME" --title "Contracts from llmops-platform $GITHUB_REF_NAME" \
            --body "Vendored from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}. CI checks the page against them."
