# Generated by tools/render_deploy.py from deploy/components.yaml. Do not edit by hand.
# Used with docker-compose.yml: docker compose -f docker-compose.yml -f docker-compose.components.yml
services:
  crawler-agent:
    image: llmops/crawler-agent:${TAG:-dev}
    command:
      - daily
    environment:
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://object-store:7070
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      LLM_GATEWAY_URL: http://llm-gateway:4000
      AUTH_MODE: dev
      DEV_USER_EMAIL: dev@example.local
      DEV_USER_GROUPS: llmops-admins
      ROLE_ADMIN: llmops-admins
      ROLE_REVIEWER_G2: llmops-reviewers-g2
      ROLE_REVIEWER_G8: llmops-reviewers-g8
      PORTAL_TZ: Asia/Taipei
      BUCKET_RAW: llmops-raw
      BUCKET_CURATED: llmops-curated
      BUCKET_DATASETS: llmops-datasets
      BUCKET_RUNS: llmops-runs
      DATABASE_URL: postgresql://llmops:${POSTGRES_PASSWORD:-llmops-local}@postgres:5432/llmops
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-localadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-localadmin-secret}
      LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-local-master-change-me}
      LLM_MODEL: agent-research
      SEARCH_BACKEND: none
      MODEL_PROVIDER: scripted
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    profiles:
      - jobs
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
