[project]
name = "llmops-common"
version = "0.1.0"
description = "Shared helpers for LLMOps platform components (config, logging, S3 storage, PostgreSQL queue, OIDC, gateway client)"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "boto3>=1.35,<2", "httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
test = ["pytest>=8", "fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
